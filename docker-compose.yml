name: treefs

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: treefs
      POSTGRES_PASSWORD: treefs
      POSTGRES_DB: treefs
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U treefs -d treefs']
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3001
      API_PREFIX: api
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: treefs
      DB_PASSWORD: treefs
      DB_NAME: treefs
      DB_POOL_SIZE: 10
      DB_POOL_WAIT_MS: 2000
      STATEMENT_TIMEOUT_MS: 5000
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  db-data:
